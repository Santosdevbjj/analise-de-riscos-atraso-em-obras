services:
  - type: web
    name: fastapi-supabase-2026
    runtime: python
    plan: free # Ou o plano de sua escolha
    buildCommand: uv sync && uv pip install supabase  # Usando o instalador do uv
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: SUPABASE_URL
        sync: false # Você preenche o valor manualmente no painel do Render por segurança
      - key: SUPABASE_KEY
        sync: false
