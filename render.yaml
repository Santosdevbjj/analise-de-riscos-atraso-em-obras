services:
  - type: web
    name: telegram-supabase-bot
    runtime: python
    plan: free
    buildCommand: uv sync && uv pip install python-telegram-bot  # Biblioteca líder em 2026
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: TELEGRAM_BOT_TOKEN
        sync: false # Defina o Token do @BotFather no painel do Render
      - key: WEBHOOK_URL
        sync: false # Será https://seu-app.onrender.com/webhook
